<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Darpan - Login</title>
    <link rel="stylesheet" href="login.css">
    <!-- Include font-awesome for social icons (optional) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <!-- Left Side: Hero Area with Illustration -->
        <div class="left-side">
            <div class="brand">

                <div>
                    <h1>Experience the Incredible Bharat</h1>
                    <p>— We plan, you enjoy! —</p>
                </div>
            </div>
            <img src="image.png" alt="Traveler with Eiffel Tower" class="illustration">
            <p class="tagline" style="font-style: italic;">Travel smarter, explore deeper!</p>
        </div>

        <!-- Right Side: Login Form -->
        <div class="right-side">
            <div class="form-box">
                <h2>Login to Continue</h2>
                <form action="#" method="post">
                    <div class="input-group">
                        <label for="email">Email or Username</label>
                        <!-- Changed from value to placeholder -->
                        <input type="text" id="email" name="email" placeholder="user@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <!-- Changed from value to placeholder -->
                        <input type="password" id="password" name="password" placeholder="............" required>
                        <i class="fas fa-eye-slash hide-icon"></i>
                    </div>
                    <a href="#" class="forgot-password">Forgot your password?</a>
                    <button type="submit" class="sign-in-btn">SIGN IN</button>
                </form>
                
                <div class="social-login">
                    <p>Or Sign in With</p>
                    <div class="social-icons">
                        <button class="google-btn"><i class="fab fa-google"></i></button>
                        <button class="facebook-btn"><i class="fab fa-facebook-f"></i></button>
                    </div>
                </div>
                
                <p class="signup-link">Don't have an account? <a href="signup.html">Sign Up Here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
